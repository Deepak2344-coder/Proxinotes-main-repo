name: notes_app
description: "Notes Distribution System — production-grade college notes subscription app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Auth + backend
  supabase_flutter: ^2.5.0

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Payments (UPI Autopay)
  razorpay_flutter: ^1.3.0

  # Screenshot blocking
  screen_protector: ^1.0.0

  # HTTP for Edge Functions
  http: ^1.2.0

  # Local persistence
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0

  # Secure storage for encryption keys
  flutter_secure_storage: ^9.0.0

  # Image caching for offline
  cached_network_image: ^3.4.0
  google_sign_in: ^7.2.0

  # URL launching for notices
  url_launcher: ^6.2.0

  # App version info for notices
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
